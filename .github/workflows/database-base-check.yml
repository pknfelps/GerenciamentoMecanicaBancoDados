name: database-base-check

# Read-only consumption of the ready base. No RDS/SQL deployment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente (develop = hom, main = prd)"
        required: true
        default: hom
        type: choice
        options: [hom, prd]

permissions: {}

# This only serializes operations in this repository. Base operations must be sequential.
concurrency:
  group: database-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  consume-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_ACCOUNT: "121754142617"
      EXPECTED_REPOSITORY: pknfelps/GerenciamentoMecanicaBancoDados
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      COMPONENT: database
      CONFIGURED_REGION: ${{ vars.AWS_REGION }}
      CONFIGURED_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SESSION_NAME: base-check-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_PAGER: ""

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate branch, environment and configured role
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in
            hom) expected_ref="refs/heads/develop" ;;
            prd) expected_ref="refs/heads/main" ;;
            *) echo "::error::Unsupported environment"; exit 1 ;;
          esac

          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" || "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Run this workflow in $EXPECTED_REPOSITORY on $expected_ref for $TARGET_ENVIRONMENT"
            exit 1
          fi

          if [[ "$CONFIGURED_REGION" != "us-east-1" ]]; then
            echo "::error::AWS_REGION must be us-east-1 in the selected Environment"
            exit 1
          fi

          expected_role="arn:aws:iam::${EXPECTED_ACCOUNT}:role/mecanica/pipelines/mecanica-${TARGET_ENVIRONMENT}-${COMPONENT}-github"
          if [[ "$CONFIGURED_ROLE_ARN" != "$expected_role" ]]; then
            echo "::error::The role variable is missing or does not match the expected component and environment"
            exit 1
          fi

      - name: Authenticate with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.CONFIGURED_REGION }}
          role-to-assume: ${{ env.CONFIGURED_ROLE_ARN }}
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT }}
          audience: sts.amazonaws.com
          role-session-name: ${{ env.SESSION_NAME }}
          role-duration-seconds: 900
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          translate-env-variables: false
          disable-retry: true
          action-timeout-s: 60

      - name: Set temporary context paths
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/database-base-kubeconfig" >> "$GITHUB_ENV"
          echo "BASE_CONTEXT=$RUNNER_TEMP/database-base-context.json" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1

      - name: Test consumer without AWS calls
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Capture ready database profile and verify resources
        run: python3 scripts/consume_database_release.py capture --environment "$TARGET_ENVIRONMENT" --context "$BASE_CONTEXT"

      - name: Recheck the captured dependency
        run: python3 scripts/consume_database_release.py recheck --environment "$TARGET_ENVIRONMENT" --context "$BASE_CONTEXT"

      - name: Summarize verified consumption
        run: |
          {
            echo "### Consumo de database-release validado"
            echo ""
            echo "Ambiente: $TARGET_ENVIRONMENT. Perfil: database."
            echo "Snapshot, recursos e acesso da role database conferidos; releitura aprovada."
            echo "Nenhum RDS, esquema ou release do banco foi implantado."
            echo "Executar operações do mesmo ambiente sequencialmente entre repositórios."
          } >> "$GITHUB_STEP_SUMMARY"
