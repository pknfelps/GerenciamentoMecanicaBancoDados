apiVersion: batch/v1
kind: Job
metadata:
  name: database-init
  namespace: database-init
  labels:
    app.kubernetes.io/name: database-init
    app.kubernetes.io/part-of: mecanica-database
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-init
        app.kubernetes.io/part-of: mecanica-database
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      volumes:
        - name: sql
          configMap:
            name: database-init-input
      containers:
        - name: initialize
          image: postgres:16.15
          command: ["/bin/sh", "-ec"]
          args:
            - |
              trap 'unset PGPASSWORD API_DB_PASSWORD AUTH_DB_PASSWORD' EXIT

              psql -q -X -v ON_ERROR_STOP=1 -v schema_file=Init.sql \
                -v schema_version="$SCHEMA_VERSION" -v sql_sha256="$SQL_SHA256" -f /sql/InitializeDatabase.sql
              psql -q -X -v ON_ERROR_STOP=1 \
                -v identity_database="$IDENTITY_DATABASE" -f /sql/CreateIdentityDatabase.sql
              PGDATABASE="$IDENTITY_DATABASE" psql -q -X -v ON_ERROR_STOP=1 -v schema_file=InitIdentity.sql \
                -v schema_version="$IDENTITY_SCHEMA_VERSION" -v sql_sha256="$IDENTITY_SQL_SHA256" -f /sql/InitializeDatabase.sql

              psql -q -X -v ON_ERROR_STOP=1 -v VERBOSITY=terse -v SHOW_CONTEXT=never --single-transaction -f /sql/ProvisionApiUser.sql
              PGDATABASE="$IDENTITY_DATABASE" psql -q -X -v ON_ERROR_STOP=1 -v VERBOSITY=terse -v SHOW_CONTEXT=never --single-transaction -f /sql/ProvisionAuthUser.sql
              echo 'Operational and identity database initialization completed'
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: database-init-input
                  key: PGHOST
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef:
                  name: database-init-input
                  key: PGDATABASE
            - name: PGUSER
              value: mecanica_admin
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-init-admin
                  key: password
            - name: API_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-init-api
                  key: password
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-init-auth
                  key: password
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /sql/rds-ca.pem
            - name: SCHEMA_VERSION
              valueFrom:
                configMapKeyRef:
                  name: database-init-input
                  key: SCHEMA_VERSION
            - name: SQL_SHA256
              valueFrom:
                configMapKeyRef:
                  name: database-init-input
                  key: SQL_SHA256
            - name: IDENTITY_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: database-init-input
                  key: IDENTITY_DATABASE
            - name: IDENTITY_SCHEMA_VERSION
              valueFrom:
                configMapKeyRef:
                  name: database-init-input
                  key: IDENTITY_SCHEMA_VERSION
            - name: IDENTITY_SQL_SHA256
              valueFrom:
                configMapKeyRef:
                  name: database-init-input
                  key: IDENTITY_SQL_SHA256
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
