apiVersion: v1
kind: Pod
metadata:
  name: database-access
  namespace: database-init
  labels:
    app.kubernetes.io/name: database-access
    app.kubernetes.io/part-of: mecanica-database
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  activeDeadlineSeconds: 3600
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: psql
      image: postgres:16.15
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: database-init-input
              key: PGHOST
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: mecanica
        - name: PGUSER
          value: mecanica_api
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /certificates/rds-ca.pem
        - name: PGCONNECT_TIMEOUT
          value: "5"
      volumeMounts:
        - name: certificates
          mountPath: /certificates
          readOnly: true
  volumes:
    - name: certificates
      configMap:
        name: database-init-input
        items:
          - key: rds-ca.pem
            path: rds-ca.pem
